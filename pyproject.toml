[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-sim"
dynamic = ["version"]
description = "Concurrent SMS alert simulation"
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
bench = [
    "matplotlib>=3.11.2",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
sms-sim = "sms_sim.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "sms_sim.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
